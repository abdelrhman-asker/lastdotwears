name: last-dot-wears

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 60s
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrator
    restart: 'no'
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      CORS_ORIGINS: https://${DOMAIN}
      WEB_APP_URL: https://${DOMAIN}
    expose:
      - '4000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - backend
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
        NEXT_PUBLIC_CONTACT_EMAIL: ${MAIL_FROM_EMAIL}
        INTERNAL_API_URL: http://api:4000/api/v1
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
      NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
      NEXT_PUBLIC_CONTACT_EMAIL: ${MAIL_FROM_EMAIL}
      INTERNAL_API_URL: http://api:4000/api/v1
      NEXT_OUTPUT_MODE: standalone
    expose:
      - '3000'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  nginx:
    build:
      context: infra/nginx
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      NGINX_ENVSUBST_FILTER: DOMAIN
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - certbot_webroot:/var/www/certbot:ro
      - nginx_tls:/etc/nginx/tls
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/healthz']
      interval: 15s
      timeout: 5s
      retries: 5
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  certbot:
    image: certbot/certbot:v5.4.0
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/scripts/renew.sh']
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env.production}
    volumes:
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
      - nginx_tls:/tls
      - ./infra/certbot:/scripts:ro
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  postgres_data:
  certbot_webroot:
  letsencrypt:
  nginx_tls:

networks:
  edge:
  backend:
    internal: true
